---
name: CodSpeed Benchmarks

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on:
      - self-hosted
      - linux
      - x64
      - cc
      - iac
      - opentofu
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 20
    container: python:3.11-slim-bookworm
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PROJECT_ENVIRONMENT: /tmp/mtrxpi-venv
      PYTEST_ADDOPTS: -o cache_dir=/tmp/mtrxpi-pytest-cache
    steps:
      - name: Restore workspace ownership
        run: chown -R "$(stat -c '%u:%g' "$(dirname "${GITHUB_WORKSPACE}")")" "${GITHUB_WORKSPACE}"

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential git portaudio19-dev curl ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          cache-local-path: /tmp/mtrxpi-uv-cache

      - name: Install Python dependencies
        run: uv sync --locked --all-groups

      - name: Run Benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          cache-instruments: false
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: uv run --no-sync pytest tests/benchmark --codspeed -n 0 --no-cov

      - name: Restore workspace ownership
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$(dirname "${GITHUB_WORKSPACE}")")" "${GITHUB_WORKSPACE}"
