---
name: Unit Tests

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on:
      - self-hosted
      - linux
      - x64
      - cc
      - iac
      - opentofu
    timeout-minutes: 20
    container:
      image: python:3.11-slim-bookworm
      volumes:
        - /var/lib/github-actions-runner/worganisation-2/work/led-matrix-controller:/repair/runner-2
        - /var/lib/github-actions-runner/worganisation-3/work/led-matrix-controller:/repair/runner-3
        - /var/lib/github-actions-runner/worganisation-4/work/led-matrix-controller:/repair/runner-4
    steps:
      - name: Repair container-created workspace files
        run: |
          for workspace in /repair/runner-*; do
            owner=$(stat -c '%u:%g' "${workspace}")
            find "${workspace}" -uid 0 -exec chown "${owner}" {} +
          done

      - name: Restore workspace ownership
        run: chown -R "$(stat -c '%u:%g' "$(dirname "${GITHUB_WORKSPACE}")")" "${GITHUB_WORKSPACE}"

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential git portaudio19-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-local-path: ${{ github.workspace }}/.uv-cache

      - name: Install Python dependencies
        run: uv sync --locked --all-groups

      - name: Test
        run: uv run --no-sync pytest --ignore=tests/benchmark --cov=led_matrix_controller --cov-report=xml

      - name: Check coverage
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          uv run --no-sync diff-cover coverage.xml \
            --compare-branch="origin/${BASE_REF}" \
            --format markdown:.coverage-report.md

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f .coverage-report.md ]; then
            cat .coverage-report.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Restore workspace ownership
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$(dirname "${GITHUB_WORKSPACE}")")" "${GITHUB_WORKSPACE}"
